<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Le Professeur 59-62</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;font-family:Arial;}
body{
  margin:0;
  background:radial-gradient(circle at top,#0f172a,#020617);
  color:white;
}
header{
  text-align:center;
  padding:20px;
}
header img{
  width:110px;
  border-radius:50%;
  box-shadow:0 0 20px #2ea6ff;
}
.categories{
  display:flex;
  gap:10px;
  padding:10px;
  overflow-x:auto;
}
.cat{
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.1);
  padding:8px 18px;
  border-radius:30px;
  cursor:pointer;
  transition:.2s;
}
.cat.active{
  background:#2ea6ff;
  box-shadow:0 0 15px #2ea6ff;
}
.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  padding:15px;
}
.card{
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:15px;
  box-shadow:0 10px 40px rgba(0,0,0,.8);
  transition:.2s;
}
.card:hover{
  transform:scale(1.04);
  box-shadow:0 0 30px #2ea6ff;
}
.price{
  color:#2ea6ff;
  font-size:20px;
  margin:10px 0;
}
.card button{
  background:linear-gradient(45deg,#2ea6ff,#00e5ff);
  border:none;
  border-radius:10px;
  padding:10px;
  color:black;
  font-weight:bold;
}
.cart{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(15,23,42,.9);
  backdrop-filter:blur(20px);
  padding:15px;
  display:flex;
  justify-content:space-between;
  box-shadow:0 -5px 40px rgba(0,0,0,.9);
}
.cart button{
  background:linear-gradient(45deg,#00e676,#1aff00);
  border:none;
  padding:12px 30px;
  border-radius:10px;
  font-weight:bold;
}
.infoBtn{
  margin-top:8px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  border-radius:10px;
  padding:8px;
  color:white;
  cursor:pointer;
}

/* === OVERLAY / INFO PAGE PREMIUM === */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(5,8,15,.85);
  backdrop-filter:blur(15px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20;
}

.panel{
  width:90%;
  max-height:85%;
  background:linear-gradient(180deg,#0b1220,#020617);
  border-radius:24px;
  padding:20px;
  overflow:auto;
  box-shadow:0 0 50px #2ea6ff;
  animation: slideUp .4s ease;
}

@keyframes slideUp{
  from{transform:translateY(40px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.panel h2{
  margin-top:0;
  color:#2ea6ff;
}

.close{
  float:right;
  background:linear-gradient(45deg,#2ea6ff,#00e5ff);
  border:none;
  border-radius:10px;
  padding:8px 14px;
  font-weight:bold;
}

.infoText{
  white-space:pre-line;
  line-height:1.6;
  margin-top:15px;
  color:#dbeafe;
}
</style>
</head>

<body>

<header>
  <img src="https://telegram-shop-93m.pages.dev/logo.png">
</header>

<div class="categories" id="categories"></div>
<div class="products" id="products"></div>

<div class="cart">
  <div>Total: <span id="total">0.00</span>€</div>
  <button onclick="checkout()">Commander</button>
</div>

<!-- ✅ UN SEUL overlay (ID unique) -->
<div class="overlay" id="overlay">
  <div class="panel">
    <button class="close" onclick="closeInfo()">← Retour</button>
    <h2 id="infoTitle"></h2>
    <div id="infoText" class="infoText"></div>
  </div>
</div>

<script>
/* ===============================
   TELEGRAM iOS SAFE INIT
================================ */
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();
tg.enableClosingConfirmation();

function waitTelegramReady(){
  return new Promise(resolve=>{
    if(tg.initData && tg.initData.length > 0){
      resolve();
    }else{
      setTimeout(()=>waitTelegramReady().then(resolve), 100);
    }
  });
}

/* ===============================
   API
================================ */
const api="https://web-production-94ef0.up.railway.app"; // ton backend Railway
const initData = tg.initData;

let allProducts=[];
let cart=[];
let total=0;

async function load(){
  const cats = await fetch(api+"/api/categories", {
    headers:{ "x-telegram-init-data": initData }
  }).then(r=>r.json());

  const prods = await fetch(api+"/api/products", {
    headers:{ "x-telegram-init-data": initData }
  }).then(r=>r.json());

  allProducts=prods;
  renderCats(cats);
  renderProducts(prods);
}

function renderCats(cats){
  const div=document.getElementById("categories");
  div.innerHTML='<div class="cat active" onclick="filter(null,this)">Tous</div>';
  cats.forEach(c=>{
    div.innerHTML+=`<div class="cat" onclick="filter('${c}',this)">${c}</div>`;
  });
}

function filter(cat,el){
  document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  renderProducts(cat?allProducts.filter(p=>p.category==cat):allProducts);
}

function renderProducts(list){
  const div = document.getElementById("products");
  div.innerHTML = "";
  list.forEach(p=>{
    const media = p.video
      ? `<video src="${p.video}" autoplay loop muted playsinline
           style="width:100%;border-radius:12px;margin-bottom:10px;"></video>`
      : `<img src="${p.image}" style="width:100%;border-radius:12px;margin-bottom:10px;">`;

    div.innerHTML += `
      <div class="card">
        ${media}
        <h3>${p.name}</h3>
        <div class="price">${p.price}€</div>
        <button onclick="add('${p.name}', ${p.price})">Ajouter</button>
        <button class="infoBtn" onclick='openInfo(${JSON.stringify(p)})'>Info</button>
      </div>
    `;
  });
}

function add(name,price){
  cart.push({name,price});
  total+=price;
  document.getElementById("total").innerText=total.toFixed(2);
  tg.HapticFeedback.impactOccurred("medium");
}

function checkout(){
  alert("Commande: "+cart.length+" articles\nTotal: "+total+"€");
}

function openInfo(p){
  document.getElementById("infoTitle").innerText = p.name;
  const text = (p.description || "Aucune description.").replace(/\n/g, "<br>");
  document.getElementById("infoText").innerHTML = text;
  document.getElementById("overlay").style.display = "flex";
}

function closeInfo(){
  document.getElementById("overlay").style.display = "none";
}

waitTelegramReady().then(load);
</script>

</body>
</html>
