<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le Professeur 59-62</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;font-family:Arial;}
body{
  margin:0;
  background:#0b0f14;
  color:white;
}
header{
  background:#111827;
  padding:15px;
  text-align:center;
}
header img{
  width:120px;
  border-radius:50%;
  border:3px solid #2ea6ff;
}
.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  padding:15px;
}
.card{
  background:#1f2937;
  border-radius:15px;
  padding:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:.2s;
}
.card:hover{
  transform:scale(1.03);
}
.card h3{
  margin:0;
  font-size:16px;
}
.price{
  font-size:20px;
  color:#2ea6ff;
  margin:10px 0;
}
.card button{
  background:#2ea6ff;
  border:none;
  border-radius:8px;
  padding:10px;
  color:white;
  font-size:16px;
}
.cart{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111827;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 -5px 20px rgba(0,0,0,.7);
}
.cart button{
  background:#00e676;
  border:none;
  padding:12px 25px;
  border-radius:8px;
  font-size:16px;
}
</style>
</head>

<body>

<header>
  <img src="https://telegram-shop-93m.pages.dev/logo.png">
</header>

<div class="products" id="products"></div>

<div class="cart">
  <div>Total: <span id="total">0.00</span>€</div>
  <button onclick="checkout()">Commander</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let cart = [];
let total = 0;

async function loadProducts(){
  const res = await fetch("https://telegram-shop-production.up.railway.app/api/products");
  const products = await res.json();
  const div = document.getElementById("products");
  div.innerHTML="";
  products.forEach(p=>{
    div.innerHTML+=`
      <div class="card">
        <h3>${p.name}</h3>
        <div class="price">${p.price}€</div>
        <button onclick="add('${p.name}',${p.price})">Ajouter</button>
      </div>
    `;
  });
}

function add(name,price){
  cart.push({name,price});
  total+=price;
  document.getElementById("total").innerText=total.toFixed(2);
  tg.HapticFeedback.impactOccurred("medium");
}

function checkout(){
  alert("Commande: "+cart.length+" articles\nTotal: "+total+"€");
}

loadProducts();
</script>

</body>
</html>
