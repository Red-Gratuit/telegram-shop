<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Le Professeur 59-62</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;font-family:Arial;}
body{
  margin:0;
  background:radial-gradient(circle at top,#0f172a,#020617);
  color:white;
}
header{text-align:center;padding:20px;}
header img{width:110px;border-radius:50%;box-shadow:0 0 20px #2ea6ff;}

.categories{display:flex;gap:10px;padding:10px;overflow-x:auto;}
.cat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);padding:8px 18px;border-radius:30px;cursor:pointer;}
.cat.active{background:#2ea6ff;box-shadow:0 0 15px #2ea6ff;}

.products{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:15px;}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:15px;}
.price{color:#2ea6ff;font-size:20px;margin:10px 0;}
.card button{width:100%;margin-top:6px;background:#2ea6ff;border:none;border-radius:10px;padding:10px;font-weight:bold;}

.cart{position:fixed;bottom:0;left:0;right:0;background:#020617;padding:15px;display:flex;justify-content:space-between;}

.infoBtn{background:#1e293b;color:white;}

/* === INFO PAGE === */
.overlay{
  position:fixed; inset:0;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(10px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20;
}
.panel{
  background:#020617;
  width:90%;
  max-height:85%;
  border-radius:20px;
  padding:20px;
  overflow:auto;
  box-shadow:0 0 40px #2ea6ff;
}
.panel h2{color:#2ea6ff;}
.close{background:#2ea6ff;border:none;border-radius:10px;padding:8px 14px;}
.infoText{white-space:pre-line;line-height:1.6;}
</style>
</head>

<body>

<header>
  <img src="https://telegram-shop-93m.pages.dev/logo.png">
</header>

<div class="categories" id="categories"></div>
<div class="products" id="products"></div>

<div class="cart">
  <div>Total: <span id="total">0.00</span>€</div>
  <button onclick="checkout()">Commander</button>
</div>

<!-- INFO PAGE -->
<div class="overlay" id="overlay">
  <div class="panel">
    <button class="close" onclick="closeInfo()">← Retour</button>
    <h2 id="infoTitle"></h2>
    <div id="infoText" class="infoText"></div>
  </div>
</div>

<script>
const api="https://telegram-shop-production.up.railway.app";
let allProducts=[], cart=[], total=0;

async function load(){
  const cats=await fetch(api+"/api/categories").then(r=>r.json());
  const prods=await fetch(api+"/api/products").then(r=>r.json());
  allProducts=prods;
  renderCats(cats);
  renderProducts(prods);
}

function renderCats(cats){
  const div=document.getElementById("categories");
  div.innerHTML='<div class="cat active" onclick="filter(null,this)">Tous</div>';
  cats.forEach(c=>div.innerHTML+=`<div class="cat" onclick="filter('${c}',this)">${c}</div>`);
}

function filter(cat,el){
  document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  renderProducts(cat?allProducts.filter(p=>p.category==cat):allProducts);
}

function renderProducts(list){
  const div=document.getElementById("products");
  div.innerHTML="";
  list.forEach(p=>{
    const media=p.video?`<video src="${p.video}" autoplay loop muted playsinline style="width:100%;border-radius:12px;"></video>`
                       :`<img src="${p.image}" style="width:100%;border-radius:12px;">`;
    div.innerHTML+=`
      <div class="card">
        ${media}
        <h3>${p.name}</h3>
        <div class="price">${p.price}€</div>
        <button onclick="add('${p.name}',${p.price})">Ajouter</button>
        <button class="infoBtn" onclick='openInfo(${JSON.stringify(p)})'>Info</button>
      </div>`;
  });
}

function add(n,p){cart.push({n,p});total+=p;document.getElementById("total").innerText=total.toFixed(2);}
function checkout(){alert("Total "+total+"€");}

function openInfo(p){
  document.getElementById("infoTitle").innerText=p.name;
  document.getElementById("infoText").innerHTML=(p.description||"").replace(/\n/g,"<br>");
  document.getElementById("overlay").style.display="flex";
}
function closeInfo(){document.getElementById("overlay").style.display="none";}

load();
</script>
</body>
</html>
