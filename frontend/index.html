<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le Professeur 59-62</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:
    linear-gradient(rgba(5,10,20,.85), rgba(5,10,20,.95)),
    url("bg.png") center/cover no-repeat fixed;
  color:white;
}

header{
  text-align:center;
  padding:20px;
  font-size:30px;
  font-weight:bold;
  text-shadow:0 0 15px red;
}

.tabs{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-bottom:15px;
}

.tabs button{
  padding:10px 20px;
  border:none;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 10px rgba(255,0,0,.4);
}

.tabs button.active{
  background:red;
  box-shadow:0 0 20px red;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:rgba(0,0,0,.75);
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 0 20px rgba(255,0,0,.4);
}

.card img,.card video{
  width:100%;
  height:150px;
  object-fit:cover;
}

.card .content{
  padding:10px;
  text-align:center;
}

.card button{
  margin-top:8px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:red;
  color:white;
  cursor:pointer;
}

#infoPage{
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(5,10,20,.9), rgba(5,10,20,.95)),
    url("bg.png") center/cover no-repeat fixed;
  display:none;
  padding:20px;
  overflow:auto;
}

#infoPage button{
  background:red;
  border:none;
  padding:10px 15px;
  border-radius:10px;
  color:white;
  margin-bottom:15px;
}

audio{display:none;}
</style>
</head>

<body>

<header>🧠 LE PROFESSEUR 59-62</header>

<div class="tabs">
  <button class="active" onclick="showCat('puff',this)">Puff</button>
  <button onclick="showCat('stup',this)">Stup</button>
  <button onclick="showCat('tabac',this)">Tabac</button>
</div>

<div id="cards" class="grid"></div>

<div id="infoPage">
  <button onclick="closeInfo()">⬅ Retour</button>
  <div id="infoContent"></div>
</div>

<audio id="bgMusic" src="music.mp3" loop></audio>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let musicStarted=false;
document.addEventListener("click",()=>{
  if(!musicStarted){
    document.getElementById("bgMusic").play();
    musicStarted=true;
  }
});

const products = {
  puff:[
    {name:"Puff 1",img:"img/puff1.jpg",desc:"Saveur fruit rouge."},
    {name:"Puff 2",img:"img/puff2.jpg",desc:"Saveur mangue."},
    {name:"Puff 3",img:"img/puff3.jpg",desc:"Saveur fraise."},
    {name:"Puff 4",img:"img/puff4.jpg",desc:"Saveur cola."},
    {name:"Puff 5",img:"img/puff5.jpg",desc:"Saveur ice."}
  ],
  stup:[
    {name:"Stup 1",video:"videos/s1.mp4",desc:"Fresh Frozen Whole Plant."},
    {name:"Stup 2",video:"videos/s2.mp4",desc:"Live Rosin Premium."},
    {name:"Stup 3",video:"videos/s3.mp4",desc:"Gold Extract."},
    {name:"Stup 4",video:"videos/s4.mp4",desc:"Cali Premium."},
    {name:"Stup 5",video:"videos/s5.mp4",desc:"Static Sift."}
  ],
  tabac:[
    {name:"Tabac",video:"videos/tabac.mp4",desc:"Tabac premium."}
  ]
};

let current="puff";

function showCat(cat,btn){
  current=cat;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function render(){
  const c=document.getElementById("cards");
  c.innerHTML="";
  products[current].forEach(p=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      ${p.img?`<img src="${p.img}">`:`<video src="${p.video}" muted loop autoplay></video>`}
      <div class="content">
        <b>${p.name}</b>
        <button onclick="showInfo(\`${p.desc}\`)">Info</button>
      </div>
    `;
    c.appendChild(div);
  });
}

function showInfo(text){
  document.getElementById("infoContent").innerText=text;
  document.getElementById("infoPage").style.display="block";
}

function closeInfo(){
  document.getElementById("infoPage").style.display="none";
}

render();
</script>

</body>
</html>
