<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Telegram Shop</title>

  <!-- Telegram SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0e1621;
      color: white;
      text-align: center;
      padding: 40px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #user {
      margin-bottom: 20px;
      font-size: 18px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      background: #2ea6ff;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>🛒 Mon Shop</h1>
  <div id="user">Chargement...</div>
  <button onclick="loadProducts()">Se connecter</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const user = tg.initDataUnsafe.user;
    document.getElementById("user").innerText =
      user ? "Bienvenue " + user.first_name : "Utilisateur inconnu";

    async function loadProducts() {
      try {
        const res = await fetch("https://telegram-shop-production.up.railway.app/api/products");
        const products = await res.json();

        let text = "🛒 Produits disponibles:\n\n";
        products.forEach(p => {
          text += `${p.name} - ${p.price}€\n`;
        });

        alert(text);
      } catch (e) {
        alert("Erreur de connexion au serveur");
      }
    }
  </script>

</body>
</html>
