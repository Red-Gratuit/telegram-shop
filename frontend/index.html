<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Le Professeur 59-62</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{margin:0;background:#0b0f14;color:white;font-family:Arial;}
header{background:#111827;text-align:center;padding:15px;}
header img{width:120px;border-radius:50%;border:3px solid #2ea6ff;}
.categories{
  display:flex;
  gap:10px;
  padding:10px;
  overflow-x:auto;
}
.cat{
  background:#1f2937;
  padding:8px 15px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
}
.cat.active{
  background:#2ea6ff;
}
.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  padding:15px;
}
.card{
  background:#1f2937;
  border-radius:15px;
  padding:15px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.price{color:#2ea6ff;font-size:18px;}
.card button{
  background:#2ea6ff;border:none;padding:10px;border-radius:8px;color:white;
}
.cart{
  position:fixed;
  bottom:0;left:0;right:0;
  background:#111827;padding:15px;
  display:flex;justify-content:space-between;
}
.cart button{
  background:#00e676;border:none;padding:12px 25px;border-radius:8px;color:black;
}
</style>
</head>

<body>

<header>
  <img src="https://telegram-shop-93m.pages.dev/logo.png">
</header>

<div class="categories" id="categories"></div>
<div class="products" id="products"></div>

<div class="cart">
  <div>Total: <span id="total">0.00</span>€</div>
  <button onclick="checkout()">Commander</button>
</div>

<script>
const api = "https://telegram-shop-production.up.railway.app";

let allProducts=[];
let cart=[];
let total=0;

async function load(){
  const cats = await fetch(api+"/api/categories").then(r=>r.json());
  const prods = await fetch(api+"/api/products").then(r=>r.json());
  allProducts=prods;
  renderCats(cats);
  renderProducts(prods);
}

function renderCats(cats){
  const div=document.getElementById("categories");
  div.innerHTML='<div class="cat active" onclick="filter(null,this)">Tous</div>';
  cats.forEach(c=>{
    div.innerHTML+=`<div class="cat" onclick="filter('${c}',this)">${c}</div>`;
  });
}

function filter(cat,el){
  document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  if(!cat) renderProducts(allProducts);
  else renderProducts(allProducts.filter(p=>p.category==cat));
}

function renderProducts(list){
  const div=document.getElementById("products");
  div.innerHTML="";
  list.forEach(p=>{
    div.innerHTML+=`
      <div class="card">
        <h3>${p.name}</h3>
        <div class="price">${p.price}€</div>
        <button onclick="add('${p.name}',${p.price})">Ajouter</button>
      </div>
    `;
  });
}

function add(name,price){
  cart.push({name,price});
  total+=price;
  document.getElementById("total").innerText=total.toFixed(2);
}

function checkout(){
  alert("Commande: "+cart.length+" produits\nTotal: "+total+"€");
}

load();
</script>

</body>
</html>
