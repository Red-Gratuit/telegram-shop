<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le Professeur 59-62</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background: url("bg.png") no-repeat center center fixed;
    background-size: cover;
    color:white;
}

.overlay {
    background: rgba(0,0,0,0.7);
    min-height:100vh;
    padding-bottom:80px;
}

header {
    display:flex;
    align-items:center;
    gap:10px;
    padding:15px;
}

header img {
    width:50px;
    border-radius:50%;
}

.categories {
    display:flex;
    justify-content:center;
    gap:10px;
    margin:15px;
}

.cat {
    padding:10px 20px;
    border-radius:20px;
    background:#111;
    cursor:pointer;
}

.cat.active {
    background:#00ffcc;
    color:black;
}

.grid {
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:15px;
    padding:15px;
}

.card {
    background: rgba(0,0,0,0.8);
    border-radius:15px;
    padding:10px;
    text-align:center;
    box-shadow:0 0 10px #00ffcc;
}

.card img, .card video {
    width:100%;
    border-radius:10px;
}

.info-btn {
    margin-top:5px;
    background:#00ffcc;
    border:none;
    padding:8px;
    border-radius:8px;
    width:100%;
    cursor:pointer;
}

#infoPage {
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:black;
    color:white;
    display:none;
    overflow:auto;
    padding:20px;
}

.back {
    background:#00ffcc;
    color:black;
    padding:10px;
    border:none;
    margin-bottom:15px;
    border-radius:10px;
}
</style>
</head>

<body>
<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="overlay">
<header>
    <img src="logo.png">
    <h2>Le Professeur 59-62</h2>
</header>

<div class="categories">
    <div class="cat active" onclick="showCategory('puff')">PUFF</div>
    <div class="cat" onclick="showCategory('stup')">STUP</div>
    <div class="cat" onclick="showCategory('tabac')">TABAC</div>
</div>

<div id="grid" class="grid"></div>
</div>

<div id="infoPage">
    <button class="back" onclick="closeInfo()">⬅ Retour</button>
    <div id="infoText"></div>
</div>

<script>
const data = {
 puff:[
  {media:"img/puff1.jpg", info:"PUFF 1"},
  {media:"img/puff2.jpg", info:"PUFF 2"},
  {media:"img/puff3.jpg", info:"PUFF 3"},
  {media:"img/puff4.jpg", info:"PUFF 4"},
  {media:"img/puff5.jpg", info:"PUFF 5"},
 ],

 stup:[
  {media:"videos/stup1.mp4", info:`🟣 FRESH FROZEN WHOLE PLANT 🟣`},
  {media:"videos/stup2.mp4", info:`🍯 LIVE ROSIN PUR 🍯`},
  {media:"videos/stup3.mp4", info:"STUP 3"},
  {media:"videos/stup4.mp4", info:"STUP 4"},
  {media:"videos/stup5.mp4", info:"STUP 5"},
  {media:"videos/stup6.mp4", info:"STUP 6"},
  {media:"videos/stup7.mp4", info:"STUP 7"},
  {media:"videos/stup9.mp4", info:"STUP 9"},
  {media:"videos/stup10.mp4", info:"PIATELLA USA"},
  {media:"videos/stup12.mp4", info:"STUP 12"},
  {media:"videos/stup13.mp4", info:"STUP 13"},
  {media:"videos/stup14.mp4", info:"STATICSIFT"},
  {media:"videos/stup17.mp4", info:"STUP 17"},
 ],

 tabac:[
  {media:"videos/tabac1.mp4", info:"TABAC"}
 ]
};

let current="puff";

function showCategory(cat){
    current=cat;
    document.querySelectorAll(".cat").forEach(c=>c.classList.remove("active"));
    event.target.classList.add("active");
    render();
}

function render(){
    const grid=document.getElementById("grid");
    grid.innerHTML="";
    data[current].forEach(item=>{
        let card=document.createElement("div");
        card.className="card";

        if(item.media.endsWith(".mp4")){
            card.innerHTML=`<video src="${item.media}" autoplay loop muted></video>`;
        } else {
            card.innerHTML=`<img src="${item.media}">`;
        }

        card.innerHTML+=`<button class="info-btn" onclick="openInfo(\`${item.info}\`)">ℹ Info</button>`;
        grid.appendChild(card);
    });
}

function openInfo(txt){
    document.getElementById("infoPage").style.display="block";
    document.getElementById("infoText").innerText=txt;
}

function closeInfo(){
    document.getElementById("infoPage").style.display="none";
}

render();
</script>

</body>
</html>
