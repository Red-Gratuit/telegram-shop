<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Telegram Shop</title>

  <!-- SDK Telegram -->
  <script>
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe.user;
document.getElementById("user").innerText =
  user ? "Bienvenue " + user.first_name : "Utilisateur inconnu";

async function sendUser() {
  const res = await fetch("https://telegram-shop-production.up.railway.app/api/products");
  const products = await res.json();

  let html = "🛒 Produits disponibles:\n\n";
  products.forEach(p => {
    html += p.name + " - " + p.price + "€\n";
  });

  alert(html);
}
</script>

</body>
</html>
