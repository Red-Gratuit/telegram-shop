<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Telegram Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0e1621;
  color:white;
}

header {
  padding:15px;
  text-align:center;
  font-size:22px;
  background:#17212b;
}

.products {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:12px;
}

.card {
  background:#1f2c3b;
  border-radius:12px;
  padding:15px;
  box-shadow:0 4px 10px rgba(0,0,0,.3);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.card h3 {
  margin:0;
  font-size:16px;
}

.price {
  font-size:18px;
  margin:10px 0;
}

.card button {
  background:#2ea6ff;
  border:none;
  border-radius:8px;
  padding:10px;
  color:white;
  font-size:16px;
}

.cart {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#17212b;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cart button {
  background:#00c853;
  border:none;
  padding:10px 20px;
  color:white;
  border-radius:8px;
  font-size:16px;
}
</style>
</head>

<body>

<header>🛒 Mon Shop</header>
<div class="products" id="products"></div>

<div class="cart">
  <div>Total: <span id="total">0</span>€</div>
  <button onclick="checkout()">Commander</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let cart = [];
let total = 0;

async function loadProducts(){
  const res = await fetch("https://telegram-shop-production.up.railway.app/api/products");
  const products = await res.json();

  const div = document.getElementById("products");
  div.innerHTML = "";

  products.forEach(p=>{
    div.innerHTML += `
      <div class="card">
        <h3>${p.name}</h3>
        <div class="price">${p.price}€</div>
        <button onclick="add(${p.id}, '${p.name}', ${p.price})">Ajouter</button>
      </div>
    `;
  });
}

function add(id,name,price){
  cart.push({id,name,price});
  total += price;
  document.getElementById("total").innerText = total.toFixed(2);
  tg.HapticFeedback.impactOccurred("light");
}

function checkout(){
  alert("Commande: " + cart.length + " articles\nTotal: " + total + "€");
}

loadProducts();
</script>

</body>
</html>
