<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Telegram Shop</title>

  <!-- SDK Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0e1621;
      color: white;
      text-align: center;
      padding: 20px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      background: #2ea6ff;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>🛒 Mon Shop</h1>
<p id="user">Chargement…</p>

<button onclick="sendUser()">Se connecter</button>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  const user = tg.initDataUnsafe.user;

  document.getElementById("user").innerText =
    user ? "Bienvenue " + user.first_name : "Utilisateur inconnu";

  function sendUser() {
    alert("Ton ID Telegram est: " + user.id);
  }
</script>

</body>
</html>
